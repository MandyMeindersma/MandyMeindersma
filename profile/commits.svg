<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 100 180' width='100px' height='180px' direction='ltr'>
        
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='100' height='180' rx='4.5'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='100' height='180' fill='white'/>
                <ellipse id='mask-ellipse' cx='-999' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#000000' stroke-opacity='0' fill='#FFFFFF' rx='4.5' x='0.5' y='0.5' width='99' height='179'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='-999' y1='24.25' x2='-999' y2='162.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#A8A8A8' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='-999' y1='24.25' x2='-999' y2='162.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#A8A8A8' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(50, 40.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7957D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        2,402
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(50, 76.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7957D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='-9'>Total</tspan><tspan x='0' dy='16'>Contributions</tspan>
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(50, 106.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#363636' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='0'>Feb 24, 2016</tspan><tspan x='0' dy='16'>- Present</tspan>
                    </text>
                </g>
            </g>
            <g style='isolation: isolate'>
                <!-- Current Streak label -->
                <g transform='translate(-999, 100.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FF3860' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='-9'>Current</tspan><tspan x='0' dy='16'>Streak</tspan>
                    </text>
                </g>

                <!-- Current Streak range -->
                <g transform='translate(-999, 137.5)'>
                    <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#363636' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Aug 4
                    </text>
                </g>

                <!-- Ring around number -->
                <g mask='url(#mask_out_ring_behind_fire)'>
                    <circle cx='-999' cy='63.5' r='40' fill='none' stroke='#7957D5' stroke-width='5' style='opacity: 1; opacity: 1;'></circle>
                </g>
                <!-- Fire icon -->
                <g transform='translate(-999, 12)' stroke-opacity='0' style='opacity: 1; opacity: 1;'>
                    <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                    <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#7957D5' stroke-opacity='0'/>
                </g>

                <!-- Current Streak big number -->
                <g transform='translate(-999, 40.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FF3860' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='font-size: 28px;'>
                        0
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
                <!-- Longest Streak big number -->
                <g transform='translate(-999, 40.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7957D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        10
                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(-999, 76.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7957D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='-9'>Longest</tspan><tspan x='0' dy='16'>Streak</tspan>
                    </text>
                </g>

                <!-- Longest Streak range -->
                <g transform='translate(-999, 106.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#363636' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='0'>Nov 19, 2016</tspan><tspan x='0' dy='16'>- Nov 28, 2016</tspan>
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
